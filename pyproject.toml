[project]
name = "ridemesh"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
# Every service is listed here too, so `uv sync` installs them (editable) into the root .venv
# and pytest and mypy can import them. Services' own images install only their own packages.
dev = [
    "hello-fastapi",
    "httpx2>=2.13.1",  # FastAPI's TestClient (Starlette 1.8 deprecated httpx for it)
    "mypy>=2.4.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

# Each service in services/<name>/ is its own package with its own pyproject.toml.
[tool.uv.workspace]
members = ["services/*"]

[tool.uv.sources]
hello-fastapi = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
# Where our own packages live, so import sorting puts them in the first-party group.
src = [".", "platform", "services/*/src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "SIM",     # simplifications
    "S",       # bandit: security
    "RUF",     # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is how pytest works

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
# importlib: several services have tests/test_hello.py; the default import mode rejects
# two test files with the same name.
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["services"]
